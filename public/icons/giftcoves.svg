<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="GiftCoves">
  <title>GiftCoves</title>

  <!-- Whole tile: nothing folded back, this one is finished -->
