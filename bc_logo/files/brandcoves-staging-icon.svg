<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="BrandCoves staging">
  <title>BrandCoves — staging</title>

  <!-- Tile with a dog-eared top-right corner: this build is a proof, not final -->
  <path d="M14,0 H43 L64,21 V50 A14,14 0 0 1 50,64 H14 A14,14 0 0 1 0,50 V14 A14,14 0 0 1 14,0 Z"
        fill="#F2A93B"/>

  <!-- Underside of the folded flap -->
  <path d="M43,0 L64,21 H43 Z" fill="#C87F1C"/>

  <!-- The cove: a headland wrapping a sheltered bay -->
  <path d="M40.6,19.71 A15,15 0 1 0 40.6,44.29"
        fill="none" stroke="#12232B" stroke-width="8.5" stroke-linecap="round"/>

  <!-- Buoy in the mouth of the cove -->
  <circle cx="44" cy="32" r="5" fill="#12232B"/>
</svg>
